name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger เมื่อ push tag ที่ขึ้นต้นด้วย v เช่น v2.3.10

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ดึง version จาก tag เช่น v2.3.10 → 2.3.10
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Cache Rust dependencies ช่วยลดเวลา build จาก ~30 นาที เหลือ ~5 นาที
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # อัพเดท version ใน tauri.conf.json จาก git tag
      - name: Update version in tauri.conf.json
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = "${{ steps.version.outputs.VERSION }}"
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8NoBOM
          Write-Host "✅ tauri.conf.json version → ${{ steps.version.outputs.VERSION }}"

      # อัพเดท version ใน Cargo.toml (ตัด build number ออก เช่น 2.3.10-1 → 2.3.10)
      - name: Update version in Cargo.toml
        shell: pwsh
        run: |
          $baseVersion = "${{ steps.version.outputs.VERSION }}" -replace '-\d+$', ''
          $content = Get-Content src-tauri/Cargo.toml
          $updated = $content -replace '^version = "[\d\.]+"', "version = `"$baseVersion`""
          Set-Content src-tauri/Cargo.toml -Value $updated
          Write-Host "✅ Cargo.toml version → $baseVersion"

      - name: Install Node dependencies
        run: npm ci

      # WebView2 Fixed Version Runtime ที่ tauri.conf.json ฝังเข้าตัวติดตั้ง (bundle.windows.webviewInstallMode)
      # ไม่ได้อยู่ใน git เพราะแตกแล้วใหญ่ราว 661 MB — ไฟล์ .cab เก็บไว้ที่ release "webview2-runtime-<เวอร์ชัน>"
      # ของ repo นี้ (ตั้งเป็น prerelease ไว้ ไม่ให้กลายเป็น latest ที่ตู้ใช้เช็คอัปเดต)
      # เวอร์ชันอ่านจาก path ใน tauri.conf.json ถ้าเปลี่ยน runtime ให้อัปโหลด .cab ตัวใหม่ขึ้น release ชื่อตามรูปแบบเดียวกัน
      - name: Prepare WebView2 fixed runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $folder = Split-Path $conf.bundle.windows.webviewInstallMode.path.TrimEnd('/') -Leaf
          if ($folder -notmatch 'FixedVersionRuntime\.([\d\.]+)\.x64$') {
            throw "อ่านเวอร์ชัน WebView2 จาก tauri.conf.json ไม่ได้: $folder"
          }
          $tag = "webview2-runtime-$($Matches[1])"
          gh release download $tag --pattern "$folder.cab" --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "ดาวน์โหลด $folder.cab จาก release $tag ไม่สำเร็จ" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-fixed-webview2.ps1 -CabPath "$env:RUNNER_TEMP\$folder.cab"
          if ($LASTEXITCODE -ne 0) { throw "แตกไฟล์ WebView2 runtime ไม่สำเร็จ" }
          if (-not (Test-Path "src-tauri/webview2-fixed/$folder/msedgewebview2.exe")) {
            throw "ไม่เจอ src-tauri/webview2-fixed/$folder/msedgewebview2.exe หลังแตกไฟล์"
          }
          Write-Host "✅ WebView2 runtime พร้อม: src-tauri/webview2-fixed/$folder"

      # tauri-action จะรัน beforeBuildCommand (npm run build) และ tauri build ให้เองอัตโนมัติ
      # TAURI_SIGNING_PRIVATE_KEY ต้องตั้งใน GitHub Secrets สำหรับ sign updater artifacts
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bonio Booth ${{ github.ref_name }}'
          releaseBody: |
            ## Bonio Booth ${{ github.ref_name }}

            **การอัพเดทอัตโนมัติ**: แอปจะแจ้งเตือนเมื่อมีเวอร์ชันใหม่

            ### วิธีติดตั้ง
            - ดาวน์โหลดไฟล์ `Bonio.Booth_*_x64-setup.exe` ด้านล่าง
            - รันไฟล์ติดตั้ง
          releaseDraft: false
          releasePrerelease: false
